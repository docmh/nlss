  suites:
    phase3:
      script: "tests/phase3/run_project_tests.R"
      plan: "tests/phase3/README.md"
      description: "Current project routing, read-only discovery, preservation and report evidence."
      persistence_script: "tests/phase3/run_persistence_tests.R"
      persistence_plan: "tests/phase3/PERSISTENCE.md"
      report_script: "tests/phase3/run_report_tests.R"
      report_plan: "tests/phase3/REPORTS.md"
    phase2:
      script: "tests/phase2/run_phase2_tests.R"
      plan: "tests/phase2/README.md"
      description: "Resolved requests, deterministic output, verified replay and independent multiple-imputation pooling checks."
      categorical_script: "tests/phase2/run_categorical_tests.R"
      psychometric_script: "tests/phase2/run_psychometric_tests.R"
      inference_script: "tests/phase2/run_inference_tests.R"
      design_script: "tests/phase2/run_design_tests.R"
      mixed_model_script: "tests/phase2/run_mixed_model_tests.R"
      mixed_diagnostic_script: "tests/phase2/run_mixed_diagnostic_tests.R"
      efa_script: "tests/phase2/run_efa_tests.R"
      sem_script: "tests/phase2/run_sem_tests.R"
      sem_diagnostic_script: "tests/phase2/run_sem_diagnostic_tests.R"
      power_script: "tests/phase2/run_power_tests.R"
      planning_script: "tests/phase2/run_planning_tests.R"
      assumptions_script: "tests/phase2/run_assumptions_tests.R"
      plot_script: "tests/phase2/run_plot_tests.R"
      transform_script: "tests/phase2/run_transform_tests.R"
      missings_script: "tests/phase2/run_missings_tests.R"
      impute_script: "tests/phase2/run_impute_tests.R"
      calc_script: "tests/phase2/run_calc_tests.R"
      history_script: "tests/phase2/run_history_tests.R"
      lifecycle_script: "tests/phase2/run_lifecycle_tests.R"
      research_script: "tests/phase2/run_research_tests.R"
    phase1:
      script: "tests/phase1/run_phase1_tests.R"
      plan: "tests/phase1/README.md"
      description: "Offline import contracts, data versions and independent numerical equivalence."
    smoke:
      script: "tests/smoke/run_smoke_test.sh"
      plan: "tests/smoke/plan-smoke.md"
      description: "Fast coverage across all modules plus template overrides."
      plot_match: '^plot_.*_smoke$'
      transform_match: '^transform_.*_smoke$'
      missings_match: '^missings_.*_smoke$'
      psychometric_match: '^(scale_all_values_pairwise_sum|scale_SPSS_variable_value_labels_and_user_missing|ICC_all_types_units_twoway-random|ICC_long_unbalanced_subject_ids_and_missing_identity_rows|kappa_numeric_order_unbalanced_quadratic|test_retest_pearson_wide|retest_SPSS_labels_user_missing_and_explicit_numeric_coercion|expected_invalid_exit_zero_still_records_nonreplayable_failed_bundle)$'
      inference_match: '^(ttest_all_values_(one_sample|independent|paired)_two[.]sided|ttest_bootstrap_numeric_paired_two[.]sided|ttest_SPSS_labels_user_missing_group_order|correlation_all_values_(pearson|spearman|kendall)_two[.]sided|partial_rank_bootstrap_and_complete_case_selection|correlation_group_Fisher_pearson_two[.]sided|configured_controls_are_effective_and_frozen_in_replay|matrix_template_contains_rounded_r_and_adjusted_p|correlation_SPSS_labels_user_missing)$'
    deliberate:
      script: "tests/smoke/run_deliberate_tests.sh"
      plan: "tests/smoke/plan-deliberate.md"
      modules:
        - calc
        - research_academia
        - descriptive_stats
        - frequencies
        - data_explorer
        - data_transform
        - missings
        - impute
        - mi_regression
        - plot
        - crosstabs
        - correlations
        - scale
        - efa
        - reliability
        - regression
        - power
        - sem
        - mixed_models
        - assumptions
        - anova
        - t_test
        - nonparametric
        - metaskill_runner
        - check_integrity
        - reconstruct_reports
